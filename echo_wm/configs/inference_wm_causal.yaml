model:
  checkpoint: checkpoints/echo-wm-flash.safetensors
  gemma_path: checkpoints/gemma-3

video:
  # 512x288 -- exact 16:9, confirmed acceptable quality. The "radical
  # config stack" (320x192 + 1-step + 4/1 window, all at once) was tried
  # and explicitly reported as "slow and awful" -- reverted in full.
  width: 512
  height: 288
  num_frames: 241
  fps: 16
  seed: 42

causal:
  # 2 steps -- confirmed acceptable quality, the setting before tonight's
  # "radical config stack" push. 1-step was tried (stacked with 4/1 window
  # + 320x192 resolution) and reported "slow and awful" -- reverted.
  # Note: 1-step was never isolated/tested on its own without the other
  # stacked changes, so it's unconfirmed whether 1-step alone (at 10/4
  # window, 512x288) would look acceptable -- not retried this session.
  timesteps: [1000, 500]
  # 10/4 -- confirmed acceptable quality (the setting before tonight's
  # push). 4/1 (tried twice now, both times as part of a larger stack)
  # confirmed looking bad both times. 7/1 was set once as an untested
  # middle ground but never actually run/reported on before being
  # overwritten by the 4/1 stack -- still genuinely untested in isolation.
  video_local_attn_size: 10
  video_sink_size: 4
  video_chunk_size: 3

action:
  enabled: true
  ucpe: true
  translation_speed: 0.05
  rotation_speed_deg: 0.4
  pitch_limit_deg: 40.0
  fov_deg: 70.0
