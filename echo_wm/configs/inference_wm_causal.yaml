model:
  checkpoint: checkpoints/echo-wm-flash.safetensors
  gemma_path: checkpoints/gemma-3

video:
  # 512x288 -- exact 16:9, a known-working combo from earlier this session.
  # width kept at 512 per explicit request; height back up from 128/192 for
  # a normal (not squished) aspect ratio, at the cost of some speed vs. the
  # smaller shapes tried above.
  width: 512
  height: 288
  num_frames: 241
  fps: 16
  seed: 42

causal:
  # 1 step -- most aggressive cut possible, highest quality risk of the
  # session. 4->2 steps was confirmed ~linear (2.0s -> ~1.0-1.1s/block
  # denoise); this pushes further for maximum speed tonight. Revert to
  # [1000, 500] (2-step, previously confirmed acceptable quality) or
  # [1000, 750, 500, 250] (native 4-step) if output is visibly broken, not
  # just softer.
  timesteps: [1000]
  # 7/1 -- untested middle ground. 10/4 confirmed acceptable quality; 4/1
  # (the minimum CausalCacheConfig.validate() allows) confirmed looking
  # bad. This sits between them for tonight's push. Revert to 10/4 if
  # motion looks broken.
  video_local_attn_size: 7
  video_sink_size: 1
  video_chunk_size: 3

action:
  enabled: true
  ucpe: true
  translation_speed: 0.05
  rotation_speed_deg: 0.4
  pitch_limit_deg: 40.0
  fov_deg: 70.0
