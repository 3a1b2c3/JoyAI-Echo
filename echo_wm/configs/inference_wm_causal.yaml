model:
  checkpoint: checkpoints/echo-wm-flash.safetensors
  gemma_path: checkpoints/gemma-3

video:
  width: 512
  height: 288
  num_frames: 241
  fps: 16
  seed: 42

causal:
  # 2 steps instead of the model's native 4 -- a further speed/quality
  # trade. NOTE: going 4->3 barely changed measured denoise time
  # (~2.0s -> ~1.9-2.2s), which suggests per-step fixed overhead (kernel
  # launch/attention setup), not step count, dominates at this scale --
  # this cut may buy little too. Revert to [1000, 750, 500, 250] (native
  # 4-step) if output quality visibly suffers and speed doesn't improve
  # enough to justify it.
  timesteps: [1000, 500]
  video_local_attn_size: 19
  video_sink_size: 7
  video_chunk_size: 3

action:
  enabled: true
  ucpe: true
  translation_speed: 0.05
  rotation_speed_deg: 0.4
  pitch_limit_deg: 40.0
  fov_deg: 70.0
