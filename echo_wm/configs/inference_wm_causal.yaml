model:
  checkpoint: checkpoints/echo-wm-flash.safetensors
  gemma_path: checkpoints/gemma-3

video:
  # width kept at 512 (last known-working value); height dropped from 288
  # for more speed -- must stay multiples of 32 (assert_resolution) for the
  # one-stage causal pipeline. 256x128 failed with a different error than
  # the 32-divisibility check (cause not yet diagnosed).
  width: 512
  height: 128
  num_frames: 241
  fps: 16
  seed: 42

causal:
  # 2 steps instead of the model's native 4 -- a speed/quality trade.
  # Confirmed via real measurement (once an unrelated torch.compile
  # recompilation bug was fixed, see TROUBLESHOOTING.md item -4) that step
  # count genuinely matters: denoise dropped from ~2.0s/block (4-step,
  # uncontaminated baseline) to ~1.0-1.1s/block at 2-step -- close to
  # linear. Revert to [1000, 750, 500, 250] (native 4-step) if output
  # quality visibly suffers.
  timesteps: [1000, 500]
  # Halved from 19/7 for more speed -- smaller attention window means less
  # per-step/per-cache-update compute, at the cost of temporal
  # coherence/motion consistency (less context each block can attend to).
  # Must satisfy CausalCacheConfig.validate(): 0 < sink < local_attn,
  # local_attn - sink >= video_chunk_size (3), and both values must be
  # 1 + n*video_chunk_size. Revert to 19/7 if motion looks visibly worse.
  video_local_attn_size: 10
  video_sink_size: 4
  video_chunk_size: 3

action:
  enabled: true
  ucpe: true
  translation_speed: 0.05
  rotation_speed_deg: 0.4
  pitch_limit_deg: 40.0
  fov_deg: 70.0
