model:
  checkpoint: checkpoints/echo-wm-flash.safetensors
  gemma_path: checkpoints/gemma-3

video:
  # 512x288 -- exact 16:9, a known-working combo from earlier this session.
  # width kept at 512 per explicit request; height back up from 128/192 for
  # a normal (not squished) aspect ratio, at the cost of some speed vs. the
  # smaller shapes tried above.
  width: 512
  height: 288
  num_frames: 241
  fps: 16
  seed: 42

causal:
  # 2 steps instead of the model's native 4 -- a speed/quality trade.
  # Confirmed via real measurement (once an unrelated torch.compile
  # recompilation bug was fixed, see TROUBLESHOOTING.md item -4) that step
  # count genuinely matters: denoise dropped from ~2.0s/block (4-step,
  # uncontaminated baseline) to ~1.0-1.1s/block at 2-step -- close to
  # linear. Revert to [1000, 750, 500, 250] (native 4-step) if output
  # quality visibly suffers.
  timesteps: [1000, 500]
  # Minimum values CausalCacheConfig.validate() allows (0 < sink <
  # local_attn, local_attn - sink >= video_chunk_size, both must be
  # 1 + n*video_chunk_size) -- most aggressive attention-window cut
  # possible, for the most speed. Went 19/7 -> 10/4 first (confirmed real
  # ~35% speedup, generation went 6.88fps -> 9.28fps); this pushes further.
  # Highest temporal-coherence risk of any change made this session --
  # revert toward 10/4 or 19/7 if motion looks visibly broken, not just
  # "a bit worse."
  video_local_attn_size: 4
  video_sink_size: 1
  video_chunk_size: 3

action:
  enabled: true
  ucpe: true
  translation_speed: 0.05
  rotation_speed_deg: 0.4
  pitch_limit_deg: 40.0
  fov_deg: 70.0
