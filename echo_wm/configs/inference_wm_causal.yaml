model:
  checkpoint: checkpoints/echo-wm-flash.safetensors
  gemma_path: checkpoints/gemma-3

video:
  width: 512
  height: 288
  num_frames: 241
  fps: 16
  seed: 42

causal:
  # 3 steps instead of the model's native 4 (evenly resampled across the
  # same 1000->250 range) -- a speed/quality trade, not a documented-correct
  # distillation schedule for 3 steps specifically. Revert to
  # [1000, 750, 500, 250] if output quality visibly suffers.
  timesteps: [1000, 625, 250]
  video_local_attn_size: 19
  video_sink_size: 7
  video_chunk_size: 3

action:
  enabled: true
  ucpe: true
  translation_speed: 0.05
  rotation_speed_deg: 0.4
  pitch_limit_deg: 40.0
  fov_deg: 70.0
